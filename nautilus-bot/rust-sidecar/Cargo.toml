[package]
name = "plainsong"
version = "0.9.0-beta.7"
description = "Plainsong - free, open-source, local-first dictation and meeting capture"
authors = ["Jonathan Reed"]
edition = "2021"
rust-version = "1.89"
default-run = "plainsong-sidecar"
license = "MIT"
repository = "https://github.com/JonathanRReed/Plainsong"

[lib]
name = "plainsong_lib"
path = "src/lib.rs"

[[bin]]
name = "plainsong-sidecar"
path = "src/bin/sidecar.rs"

# The `plainsong` command-line tool and read-only MCP server. A separate
# binary rather than a mode of the sidecar because the sidecar is spawned by
# Electron over stdio with no socket: a terminal or an AI assistant has nothing
# to connect to. This binary opens the same SQLCipher database read-only
# (see `db::Database::open_read_only_at_path`) and reuses the library's query
# and export code, so nothing in the running sidecar changes for reads.
[[bin]]
name = "plainsong-cli"
path = "src/bin/plainsong-cli.rs"

[dependencies]
lazy_static = "1.4"
unicode-normalization = "0.1.24"
serde = { version = "1", features = ["derive"] }
# Preserve measured audio times across JSON storage before exact enrichment checks.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "blob"] }
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
cpal = "0.18"
hound = "3.5"
crossbeam = "0.8"
ringbuf = "0.5.2"
libc = "0.2"

# ASR Dependencies
# Whisper with Metal/CoreML GPU acceleration on macOS
whisper-rs = { version = "0.16", optional = true }

# ONNX Runtime for Parakeet and other ONNX models
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }

# Candle for HuggingFace models (Canary, etc.)
# The `metal` feature is gated behind the `candle-metal` Cargo feature so that
# non-macOS builds are not broken by Metal-only dependencies. On macOS, enable
# `candle-metal` to route Candle inference through the GPU.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }

# Tokenizers for HuggingFace models
tokenizers = { version = "0.23", optional = true }

# transcribe.cpp: one ggml runtime that hosts Parakeet TDT, Whisper, Nemotron
# streaming, Qwen3-ASR, Cohere Transcribe, Voxtral and Moonshine v2 from a
# single GGUF loader. Pulled in only by the `asr-transcribe-cpp` feature, which
# is off in Cargo's default set and enabled for macOS release builds by
# scripts/sidecar-cargo-features.ts; see
# artifacts/qa/transcribe-cpp-spike-2026-09-02.md for the original spike.
# MIT-licensed, same as this crate.
#
# The crates.io release, NOT the git rev it was cut from. A `git` source is not
# resolvable from a cargo cache that only holds registry crates, so
# `cargo metadata --locked --offline` failed for EVERY feature set -- including
# the default and release ones that compile none of this -- which took
# `lint:rust`, `test:rust`, `licenses:generate` and `release:mac` with it on an
# offline box. Registry sources resolve from the local cache, and the lockfile
# gains a checksum a git source cannot carry.
#
# Same bytes: transcribe-cpp 0.2.3 and transcribe-cpp-sys 0.2.3 were published
# from 63a44d9239d610b3908e8a66b384924cd4a77217 (their `.cargo_vcs_info.json`
# records that sha, which was the `release: 0.2.3` commit this used to pin),
# and their `Cargo.toml.orig`, Rust sources, `include/`, `src/`, `cmake/` and
# vendored `ggml/` trees diff clean against that checkout.
#
# `default-features = false, features = ["metal"]` rather than a `whisper-gpu`-
# style `transcribe-cpp?/metal` feature in `default`. That shape was tried and
# reverted: a `dep?/feature` reference from an ENABLED feature pulls the optional
# crate into the release resolve graph even though nothing compiles it, which put
# transcribe-cpp and transcribe-cpp-sys into the shipped THIRD-PARTY-NOTICES
# (532 -> 534 Rust packages) -- notices for two crates the shipped binary does
# not contain. Upstream's build.rs only forwards -DTRANSCRIBE_METAL on Apple
# targets and documents `metal` as a no-op elsewhere, so naming it here does not
# make this dependency macOS-only. A CPU measurement needs no rebuild either
# way: PLAINSONG_TRANSCRIBE_CPP_BACKEND=cpu pins the device at runtime.
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"], optional = true }

# Audio preprocessing. Not optional: the mixed ("Me + Them") capture path
# resamples whichever of the mic/loopback devices is running at the lower rate
# onto the session's target rate, so this has to be present in every build, not
# only the ones that happen to enable an ASR provider.
rubato = "5.0"

# FFT for FBank feature extraction in diarization
rustfft = { version = "6.2", optional = true }

# HTTP client for Ollama and downloads
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }

# Download management
futures-util = "0.3"
sha2 = "0.11"
rand = "0.10"
async-trait = "0.1"
hex = "0.4"
argon2 = "0.6"
aes-gcm = "0.11"
zeroize = "1.8"
# keyring 3.x ships NO platform credential store unless a backend feature is
# named; without one it silently uses an in-memory mock, so every "stored in
# the OS keychain" promise (vault key, provider keys, integrity MAC key) was
# false and secrets evaporated at process exit. apple-native = macOS Keychain;
# windows-native compiles in only on Windows builds.
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
unicode-segmentation = "=1.12.0"
regex = "1.11"
urlencoding = "2.1"
hostname = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
walkdir = "2.5"

# EXPERIMENTAL Nemotron 3 Diarization (NVIDIA Sortformer v3) through
# parakeet-rs (MIT OR Apache-2.0). Behind `diarization-nemotron`, off by
# default and not in the release feature list. It pins the same
# `ort 2.0.0-rc.13` and `ndarray 0.17` as this crate, so no second ONNX
# Runtime is linked. `default-features = false` drops parakeet-rs's own `ort`
# defaults so ours decide how ONNX Runtime is fetched and linked.
parakeet-rs = { version = "0.3.8", optional = true, default-features = false, features = ["sortformer"] }

# Optional progress bars
indicatif = { version = "0.18", optional = true }

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", features = ["AVFCapture", "AVMediaFormat", "block2"] }
objc2-speech = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSValue", "NSUUID"] }
# Meeting audio: a device-independent Core Audio process tap (see
# src/audio/macos_system_tap.rs). Already in the tree through CPAL; listed here
# because the sidecar now calls these bindings itself.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary"] }

[dev-dependencies]
# Only "test-util" beyond what [dependencies] already enables via "full":
# `tokio::time::pause`/`#[tokio::test(start_paused = true)]` for deterministic
# timeout tests that don't race a real sleep against the wall clock. Cargo
# unions features across dependency kinds for test/bench builds only, so this
# never ships in the release binary.
tokio = { version = "1", features = ["test-util"] }

[features]
default = ["asr-all", "sqlcipher", "whisper-gpu", "local-llm", "local-embeddings", "meeting-audio-16k"]

# Compact finalized meeting storage. Capture and first-pass ASR stay native-rate.
meeting-audio-16k = []

# The built-in text models: S1-mini dictation cleanup and the Qwen3 notes
# models, run by the separate llama.cpp text helper (`text-helper/`). The
# sidecar only downloads, verifies and starts them, so this pulls in no
# inference crate. A build without it tells the user to pick Ollama or a
# cloud provider.
local-llm = ["download-manager"]

# Built-in meaning search: text embedding models Plainsong downloads from
# pinned revisions and runs in-process through ONNX Runtime on the CPU. Adds no
# new crate: ort, ndarray and tokenizers already come with `asr-parakeet`.
# In `default` so meaning search works without Ollama.
local-embeddings = ["ort", "ndarray", "tokenizers", "download-manager"]

# ASR Provider Features
asr-whisper = ["whisper-rs", "download-manager"]
asr-parakeet = ["ort", "ndarray", "download-manager", "audio-processing", "rustfft", "tokenizers"]
asr-canary = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "download-manager", "audio-processing", "rustfft"]
asr-all = ["asr-whisper", "asr-parakeet", "asr-canary", "diarization"]

# Experimental local GGUF routes through transcribe.cpp on Metal. Enabled by
# the macOS build wrapper, kept out of Cargo's cross-platform default set.
# Model downloads stay optional. Native capture evidence:
# docs/evals/unified-native-capture-2026-10-03/README.md.
asr-transcribe-cpp = ["transcribe-cpp", "download-manager"]

# Whisper GPU acceleration (Metal — macOS only). No CUDA feature is wired;
# non-macOS builds must use --no-default-features and re-enable
# asr-all/sqlcipher explicitly, or the whisper.cpp CMake build fails.
#
# CoreML is deliberately NOT enabled. It was, and it never worked: with the
# feature on, whisper.cpp tries to load `ggml-<model>-encoder.mlmodelc` on every
# model init, but nothing in this repo ever downloads that artifact — not
# scripts/provision-asr-assets.ts, not src/download/, not asr/whisper.rs. The
# models directory only ever contains `ggml-<model>.bin`. So every user on every
# machine paid a failed load and an alarming
# "failed to load Core ML model from ..." line in the log on every init, then
# silently ran the Metal path anyway.
#
# Turning it back on means shipping the encoder too: it is published alongside
# the ggml weights as a `.mlmodelc.zip` that has to be fetched and unpacked, and
# it costs a one-time on-device compile the first time it loads. Worth doing
# only with a measurement behind it. The Metal baseline to beat, measured on an
# M4 Pro with base.en: 66ms p50 at 1s of audio, 101ms at 5.3s, 569ms at 44s.
whisper-gpu = ["whisper-rs?/metal"]

# Candle Metal GPU acceleration (macOS only). Routes Candle-based models
# (Whisper Large V3 Turbo, Distil Whisper) through the Metal backend instead
# of CPU F32. Note: candle-nn MUST also get the `metal` feature —
# without it, the Metal rms-norm kernel isn't compiled and inference crashes.
#
# SHIPPED on macOS: scripts/sidecar-cargo-features.ts adds it to the release
# build, to lint/test/benchmark, to CI, and to the third-party notices. Kept
# out of `default` because it only compiles against Apple frameworks.
# Measured on an M4 Pro with distil-large-v3.5, using a combined
# candle-metal+ort-coreml dev binary on a loaded shared machine
# (artifacts/qa/acceleration-receipt-2026-09-01.md; the shipped binary itself
# still owes a quiet-machine re-run): CPU F32 takes 32.8 s p50 for a 5.3 s
# utterance and 55.5 s for 44 s of audio; Metal takes 0.96 s and 2.6 s. The
# first inference in a fresh process pays a Metal shader compile (1.1 s with a
# warm shader cache, ~60 s observed under heavy memory pressure).
candle-metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

# ONNX Runtime CoreML Execution Provider (macOS only). Registers the CoreML EP
# on the ONNX sessions built through `ort_utils::build_session` (Silero VAD,
# Wespeaker diarization, Moonshine, the Qwen3 encoder). Parakeet and the Qwen3
# decoders bypass it (unstable / int4). The EP falls back to CPU if the
# prebuilt ONNX Runtime binary lacks CoreML or initialization fails.
#
# Deliberately NOT shipped: scripts/sidecar-cargo-features.ts leaves it out.
# Measured on an M4 Pro with Moonshine base
# (artifacts/qa/acceleration-receipt-2026-09-01.md): the encoder graph gets
# split into 75 CoreML partitions (393 of 743 nodes supported), the merged
# decoder is a single `If` node CoreML rejects outright, the first load spends
# ~24 s compiling CoreML models (4.5 s on later launches, versus 0.7 s on CPU),
# and steady state is slower than plain CPU (44 s fixture: 1.7 s p50 on CPU
# versus 2.1 s p50 / 5.6 s p95 with CoreML). Silero VAD gains nothing either:
# CoreML supports 0 of its 2 graph nodes (an `If` over the 8k/16k subgraphs),
# so it stays on CPU with ~6% extra per-chunk overhead from the registered EP.
# Re-enable only behind per-session opt-outs (plus `ModelCacheDirectory`,
# `EnableOnSubgraphs`, `RequireStaticInputShapes`) and a new measurement.
ort-coreml = ["ort-coreml-ep"]
# Links the ONNX Runtime build that carries the Core ML execution provider
# without registering it anywhere by default (`ort-coreml` above does that for
# every session and is a measured regression). Only callers that measured a win
# opt in per session: pyannote community-1's ResNet34 embedding network
# (`diarization::community1::inference`), ~20x faster on the GPU.
ort-coreml-ep = ["ort/coreml"]

# SQLCipher for encrypted SQLite (optional, requires OpenSSL)
sqlcipher = ["rusqlite/sqlcipher", "libsqlite3-sys/bundled-sqlcipher"]

# Supporting features
download-manager = ["indicatif"]
# Retained so the ASR provider features keep their existing shape; `rubato` is
# now an unconditional dependency, so this no longer gates anything.
audio-processing = []
desktop-shell = []

# Speaker diarization (requires ONNX runtime): the embedding + clustering
# models and pyannote community-1 (`diarization::community1`, pure Rust on the
# shared ONNX Runtime, no BLAS).
diarization = ["ort", "ndarray", "rustfft"]
# Optional experimental Nemotron 3 Diarization. Enabled in macOS builds;
# model download and selection remain opt-in.
diarization-nemotron = ["diarization", "dep:parakeet-rs"]

[patch.crates-io]
# CPAL 0.18.1's macOS loopback implementation links the macOS 14.2 process-tap
# symbols strongly, which prevents the sidecar from launching on our supported
# macOS 13 floor. This narrow vendor patch resolves only those two symbols at
# runtime and preserves the upstream API and all non-macOS behavior.
cpal = { path = "vendor/cpal-0.18.1" }
candle-core = { path = "vendor/candle-core-0.10.2" }
# Same pinned native revision, with one shared Qwen generation budget.
transcribe-cpp-sys = { path = "vendor/transcribe-cpp-sys-0.2.3" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind, not abort.
#
# `panic = "abort"` made every one of the sidecar's own panic-recovery paths
# dead code: the `handle.join()` arms that report "<thread> panicked", and the
# `spawn_blocking` join-error arms, can only ever run if a panic unwinds. Under
# abort, a panic on any worker thread -- a WAV writer, a transcription task, a
# blocking pool thread -- killed the whole process instead, taking an in-progress
# meeting and its unflushed audio with it.
#
# Unwinding is safe at the FFI boundaries here. Every `extern "C"` block in this
# crate *declares* foreign functions Rust calls (Accessibility, CoreGraphics,
# `renameatx_np`); none export Rust to C, so no unwind of ours can escape into a
# C frame from this crate. Where third-party crates do install Rust callbacks
# behind `extern "C"` trampolines -- cpal/coreaudio-rs render callbacks,
# whisper-rs segment callbacks, ort logging -- the toolchain's plain `extern "C"`
# ABI aborts on unwind by default (Rust 1.81+; this crate builds on 1.89+), so
# those sites behave exactly as they did under abort rather than becoming
# undefined. `guard_audio_callback` additionally catches panics inside the
# realtime audio callbacks we own, so those degrade to an inert stream instead
# of reaching that abort at all.
panic = "unwind"
# Not `true`: on macOS rustc strips with its bundled `rust-objcopy`, whose
# output current dyld rejects ("mis-aligned LINKEDIT string pool"). That broke
# every proc macro in a release build ("can't find crate for zerofrom_derive")
# and left the sidecar unloadable by `dyld_info`. scripts/build-rust-sidecar.ts
# strips the shipped binaries with the platform's own `strip` instead.
strip = false

[profile.dev]
opt-level = 1

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.ort]
opt-level = 3

[profile.dev.package.whisper-rs]
opt-level = 3
