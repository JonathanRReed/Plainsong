appId: com.plainsong.app
productName: Plainsong
copyright: Copyright © 2026 Jonathan Reed

# CFBundleVersion. Without this electron-builder defaults it to `version`, so a
# prerelease shipped CFBundleVersion="0.9.0-beta.2" — and Apple defines that key
# as one to three period-separated INTEGERS. A value with a hyphen and a word in
# it is not a build number; it is a string macOS has no ordering for, so
# anything comparing builds either fails or falls back to string comparison. The
# semantic version stays in CFBundleShortVersionString, where it belongs.
#
# The number is `encodeBundleBuildVersion(version)` from
# scripts/lib/bundle-build-version.mjs, which packs the version into one integer
# and ranks a prerelease below the release it precedes (0.9.0-beta.2 → 900302,
# and the 0.9.0 that follows → 900999). This file is static YAML, so it is
# applied by hand and pinned to package.json by a unit test: a version bump that
# forgets it fails there rather than in a shipped bundle.
buildVersion: "900303"

# Electron ships these fuses permissive by default, which would make a notarized
# Plainsong a reusable gadget: `ELECTRON_RUN_AS_NODE=1` on the signed binary runs
# arbitrary Node under our Developer ID, which carries device.microphone,
# automation.apple-events and disable-library-validation — plus the
# Accessibility grant the app holds so it
# can inject keystrokes into every application. Notarization cannot be retracted
# by shipping a later version, so this has to be right before the first ticket.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

directories:
  output: release
  buildResources: build-resources

# Chromium carries its own UI strings for 55 languages, and on macOS that is 220
# `.lproj` directories once the grammatical-gender variants are counted — 47 MB
# inside Electron Framework.framework, 12% of the installed application.
#
# Plainsong has no localization layer: there is no i18n runtime in
# `package.json`, no string catalogue in `src/`, and every word of the product
# is written in English in the source. What those `.pak` files translate is
# Chromium's own furniture — the text-field context menu, the file picker, the
# spell-check submenu — so shipping them means a Polish "Wklej" in a menu
# attached to a window whose every label is English. Removing them costs
# nothing a user can see.
#
# electron-builder deletes the unwanted directories in
# `removeUnusedLanguagesIfNeeded` while it prepares the bundle, i.e. before the
# app is signed, so the signature and the notarization ticket cover exactly what
# ships. `en-US` is listed beside `en` because the matcher keeps a locale file
# when a wanted language is a prefixed form of it; the pair resolves to the one
# `en.lproj`, and naming both makes the intent survive an Electron upgrade that
# renames the file.
#
# `icudtl.dat` stays whole, so every locale's date, time, number and collation
# data is still on disk. What the deletion DOES change is which locale ICU
# defaults to: Chromium seeds it from the resource bundle it managed to load, so
# with only `en.lproj` present the default inside the packaged app is `en-US`
# whatever the Mac is set to. Measured 2026-09-02 with this repo's own Electron
# 43.4.0, both `.lproj` sweeps applied, system language set through
# NSUserDefaults: a German Mac went from `4.3.2026, 09:30:00` to
# `3/4/2026, 9:30:00 AM`, French and Japanese likewise.
#
# So the renderer never relies on that default. `electron/app-locale.ts` reads
# `app.getPreferredSystemLanguages()` — macOS' own AppleLanguages, which the
# deletion cannot touch — passes it to every renderer through
# `webPreferences.additionalArguments`, and `src/lib/format-locale.ts` supplies
# it to every `Intl` call. Dates, times and sort order follow the user's own
# language again; `src/__tests__/renderer-locale-bridge.test.ts` fails the build
# if any file under `src/` formats without it.
electronLanguages:
  - en
  - en-US

# `plainsong://` deep links (record, stop, mode, meeting/start, meeting/stop,
# open). This writes CFBundleURLTypes so macOS hands the URL to the running
# app via `open-url`; the app ignores every link unless Settings > General >
# Local tools is on, and parses only the six commands above
# (electron/deep-link-policy.ts). The scheme is the renderer's own privileged
# scheme on purpose: see the rationale at the top of that file.
protocols:
  - name: Plainsong
    schemes:
      - plainsong

# Fail packaging before signing if a required native helper is absent, has the
# wrong deployment target, or no longer matches its Rust protocol.
afterPack: scripts/verify-packaged-native-helpers.mjs

files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/preload.js.map"
  - node_modules/**
  # Everything the renderer imports — React, React DOM, Radix, Base UI, cmdk,
  # 19 MB of Lucide icons — is compiled into dist/ by Vite before packaging.
  # electron-builder then copied the *source* of all of it into app.asar as
  # well, because it packs the whole production dependency tree: 39 of the
  # asar's 43 MB was a second copy of code that no packaged code path can
  # reach. `dist/index.html` is loaded over the renderer's own scheme and
  # requires nothing from node_modules; the main process (electron/main.ts and
  # its neighbours) imports exactly one real package, electron-updater.
  #
  # So the rule is inverted: exclude every top-level entry under node_modules
  # that is not electron-updater or one of its transitive dependencies. Written
  # this way a new renderer dependency is excluded the day it is added, instead
  # of the day someone remembers to come back here. The cost is that a new
  # *main-process* dependency must be added to this list or the packaged app
  # will not start — which is why
  # src/__tests__/macos-packaging-config.test.ts recomputes the closure from
  # node_modules and the imports in electron/, and fails when this line and the
  # code disagree in either direction. `bun run gate:cold-start` on the packed
  # app is the second net: it launches the real bundle and waits for the
  # renderer.
  #
  # Nested node_modules under a kept package are unaffected (the pattern only
  # matches the first path segment), so electron-updater keeps any hoist-broken
  # copies of its own dependencies.
  #
  # That one-segment rule is also how a SCOPED package would have to be listed:
  # minimatch matches this extglob against a single path segment, so
  # `@scope/name` is kept by naming `@scope` — the whole scope — and never by
  # `@scope/name`, which can never match anything. The test compares the two
  # sides on that same first segment for the same reason.
  - "!node_modules/!(argparse|builder-util-runtime|debug|electron-updater|fs-extra|graceful-fs|js-yaml|jsonfile|lazy-val|lodash.escaperegexp|lodash.isequal|ms|sax|semver|tiny-typed-emitter|universalify)/**"

extraResources:
  # Keep the project's MIT license and generated dependency attributions beside
  # the packaged application so binary distributions carry their legal notices.
  - from: ../LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  - from: rust-sidecar/target/release/
    to: sidecar
    filter:
      - plainsong-sidecar
      - plainsong-sidecar.exe
      # The `plainsong` command-line tool and read-only MCP server. Same
      # directory as the sidecar so it is signed under the same rule in
      # scripts/sign-macos.mjs and checked by verify-packaged-native-helpers.
      - plainsong-cli
      - plainsong-cli.exe

mac:
  # The limited beta is arm64 only: the Rust sidecar is compiled for the host arch by
  # `sidecar:build:release`, so an x64 artifact would bundle an arm64 binary and
  # be broken on Intel Macs. Intel support needs per-arch sidecar cross-compiles
  # (aarch64- + x86_64-apple-darwin) wired into the build, tracked as a follow-up.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # Keep the bundle metadata aligned with the documented beta support floor.
  minimumSystemVersion: "13.0"
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  # The Speech helper reads audio supplied by the Rust process; it does not own
  # microphone capture, Apple Events, or a JIT. Give that binary only its Speech
  # entitlement instead of the broad Electron child-process entitlement set.
  sign: scripts/sign-macos.mjs
  binaries:
    - Contents/Resources/sidecar/nautilus-macos-speech-helper-aarch64-apple-darwin
    - Contents/Resources/shortcut-helper/plainsong-native-shortcut-helper
    - Contents/Resources/calendar-helper/plainsong-native-calendar-helper
    - Contents/Resources/language-model-helper/plainsong-native-language-model-helper
  icon: build-resources/icon.icns
  # Required TCC usage strings — without these macOS terminates the app the
  # moment it accesses the microphone / speech recognition.
  extendInfo:
    NSMicrophoneUsageDescription: "Plainsong transcribes your speech on your Mac for dictation and meeting capture. Audio stays on your device."
    NSAudioCaptureUsageDescription: "Plainsong captures audio playing on your Mac to record and transcribe meetings. Depending on your transcription settings, meeting audio may be processed on this Mac or sent to the cloud provider you choose."
    NSSpeechRecognitionUsageDescription: "Plainsong can use Apple's on-device speech recognition to transcribe your dictation."
    # Calendar reading is done by a separate signed helper, but TCC attributes a
    # spawned child's prompt to the RESPONSIBLE process — this app — and reads
    # the string from this Info.plist. Both keys are listed because macOS 13
    # (the support floor) reads NSCalendarsUsageDescription and macOS 14+ reads
    # NSCalendarsFullAccessUsageDescription; shipping one of the two shows half
    # the supported range an empty prompt. The helper's own embedded plist
    # (build-resources/info.mac.calendar-helper.plist) carries the identical
    # pair, and the strings are word-for-word the same because which one a
    # reader sees depends on their macOS version, not on what Plainsong does.
    NSCalendarsUsageDescription: "Plainsong reads your calendar on this Mac so it can offer to start capturing the meeting you are about to join. Nothing is written to your calendar and nothing leaves your Mac."
    NSCalendarsFullAccessUsageDescription: "Plainsong reads your calendar on this Mac so it can offer to start capturing the meeting you are about to join. Nothing is written to your calendar and nothing leaves your Mac."
  # macOS-only native helper (built by `shortcut-helper:build`) that observes
  # the dictation hotkey via a listen-only CGEventTap so press-and-hold works.
  # Packaged the same way as the Rust sidecar: it must be signed with the same
  # identity/entitlements as the main app — see docs/CODE_SIGNING.md.
  extraResources:
    - from: dist-native/
      to: shortcut-helper
      filter:
        - plainsong-native-shortcut-helper
    # Read-only EventKit helper (built by `calendar-helper:build`). Kept in its
    # own resource directory rather than beside the shortcut helper so the
    # packaged-helper gate can name one path per entitlement policy.
    - from: dist-native/
      to: calendar-helper
      filter:
        - plainsong-native-calendar-helper
    # Apple Foundation Models helper (built by `language-model-helper:build`).
    # Its own resource directory for the same reason as the calendar helper:
    # the packaged-helper gate names one path per entitlement policy, and this
    # one's policy is "no entitlements at all".
    - from: dist-native/
      to: language-model-helper
      filter:
        - plainsong-native-language-model-helper
    - from: rust-sidecar/binaries/
      to: sidecar
      filter:
        - nautilus-macos-speech-helper-aarch64-apple-darwin

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Avoid electron-builder's space-containing default setup artifact name for
  # cleaner download URLs.
  artifactName: ${productName}-Setup-${version}.${ext}

dmg:
  # lzfse rather than electron-builder's default zlib. Measured with hdiutil on
  # this build's own 297 MB Plainsong.app, one source folder, four formats:
  #
  #   UDZO (the default, zlib-level=9)  132,494,542 bytes
  #   ULFO (lzfse-level=9)              129,218,471 bytes   -2.5%
  #   UDBZ (bzip2-level=9)              121,123,816 bytes   -8.6%
  #   ULMO (lzma-level=9)                97,964,404 bytes  -26.1%
  #
  # ULMO is by far the smallest and is NOT usable: electron-builder 26.15.3's
  # own configuration schema accepts only UDBZ, UDCO, UDRO, UDRW, UDZO and
  # ULFO, and rejects the config outright before packaging starts. (Found by
  # running the pack, not by reading the docs.) Revisit if a later
  # electron-builder adds it — the format itself works, mounts on macOS 10.15+,
  # and would take the download to 93 MB. `compresses the DMG with a format
  # electron-builder will accept` reads that list straight out of
  # `node_modules/app-builder-lib/scheme.json`, so an upgrade that adds ULMO
  # surfaces here rather than in a build log.
  #
  # Of the three that are allowed, ULFO is the only one that is better than the
  # default on both axes: lzfse decodes faster than zlib as well as packing
  # smaller, so the disk image is smaller to download AND quicker to mount and
  # drag out of. UDBZ saves 8 MB more but bzip2 decompresses several times
  # slower than zlib, which would be paid in the one visible moment of the
  # install — the copy to /Applications — to save about four seconds of
  # download on a 20 Mbit line. That is a trade, not a win, so it was not taken.
  #
  # lzfse has been mountable since macOS 10.11 and this bundle's floor is 13.0.
  # The measured ULFO image was attached read-only and its Plainsong.app read
  # back whole before it was detached.
  #
  # `bun run electron:pack` was re-run after this line was added, so the
  # configuration is known to validate. What has NOT been exercised is
  # electron-builder's dmg target end-to-end: that path signs and notarizes and
  # this machine has no credentials. The first `release:mac` after this change
  # must confirm a DMG was produced and mounts before anything is distributed.
  format: ULFO
  # The DMG is the primary download. electron-builder notarizes the .app before
  # creating this artifact, so sign the disk image here; the release workflow
  # then submits the signed DMG separately and staples its own notary ticket.
  sign: true
  # Stapling changes the DMG bytes after electron-builder has finished. Do not
  # emit a pre-staple DMG blockmap/hash into beta-mac.yml; macOS updates use
  # the ZIP and its blockmap, while the final DMG is covered by SHA256SUMS.txt.
  writeUpdateInfo: false
  # The install gesture, stated in the window itself: app on the left,
  # /Applications on the right, drag between them. Without an explicit layout
  # electron-builder opens a default-sized window with both items wherever the
  # Finder puts them, which reads as an unfinished disk image on the one screen
  # every user sees before the app has run once.
  #
  # The window is sized to hold the two 128pt icons and their labels with margin
  # at the default Finder icon spacing; the y values put both rows on the same
  # baseline, and the x values leave the drag arc unobstructed.
  #
  # No background image deliberately: a bitmap has to be authored at 1x and 2x
  # and kept aligned with these coordinates by hand, and a misaligned one looks
  # worse than none. The layout alone carries the instruction.
  window:
    width: 560
    height: 400
  iconSize: 128
  iconTextSize: 12
  contents:
    - x: 150
      y: 200
      type: file
    - x: 410
      y: 200
      type: link
      path: /Applications

publish:
  # The repository remains private during the limited beta, so installed apps
  # use a credential-free feed rather than GitHub Releases. This URL must match
  # the public R2 custom domain verified by the release gate before invitations.
  #
  # This block bakes exactly ONE feed into the packaged app-update.yml, and the
  # feed is per-channel: /beta/ carries beta-mac.yml, /stable/ carries
  # latest-mac.yml (`resolveUpdaterChannel("stable")` is "latest" — there is no
  # stable-mac.yml). A stable install reading THIS url would have requested
  # latest-mac.yml out of the beta bucket. The running app therefore calls
  # autoUpdater.setFeedURL(updaterFeedOptions(channel)) before every check
  # (electron/updater-channel.ts), and what is written here is only the default
  # a build falls back to before that runs.
  #
  # It stays /beta/ with channel beta because this candidate IS a beta:
  # `effectiveUpdaterChannel` pins a prerelease build to the beta channel
  # regardless of the configured setting, so the packaged default and the
  # runtime resolution agree for every install of this build. Publishing the
  # first stable release means creating /stable/latest-mac.yml, which
  # `qa:packaged:macos:public-update-feed` now requires for both channels.
  provider: generic
  url: https://updates.plainsong.jonathanrreed.com/beta/
  channel: beta
  # R2 supports ordinary byte ranges. Avoid multipart range behavior that can
  # vary between object stores and is unnecessary for this beta feed.
  useMultipleRangeRequest: false
