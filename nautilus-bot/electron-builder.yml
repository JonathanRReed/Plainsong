appId: com.plainsong.app
productName: Plainsong
copyright: Copyright © 2026 Jonathan Reed

# Electron ships these fuses permissive by default, which would make a notarized
# Plainsong a reusable gadget: `ELECTRON_RUN_AS_NODE=1` on the signed binary runs
# arbitrary Node under our Developer ID, which carries device.microphone,
# automation.apple-events and disable-library-validation — plus the
# Accessibility grant the app holds so it
# can inject keystrokes into every application. Notarization cannot be retracted
# by shipping a later version, so this has to be right before the first ticket.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

directories:
  output: release
  buildResources: build-resources

# Fail packaging before signing if a required native helper is absent, has the
# wrong deployment target, or no longer matches its Rust protocol.
afterPack: scripts/verify-packaged-native-helpers.mjs

files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/preload.js.map"
  - node_modules/**

extraResources:
  # Keep the project's MIT license and generated dependency attributions beside
  # the packaged application so binary distributions carry their legal notices.
  - from: ../LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  - from: rust-sidecar/target/release/
    to: sidecar
    filter:
      - plainsong-sidecar
      - plainsong-sidecar.exe

mac:
  # arm64 only for v1: the Rust sidecar is compiled for the host arch by
  # `sidecar:build:release`, so an x64 artifact would bundle an arm64 binary and
  # be broken on Intel Macs. Intel support needs per-arch sidecar cross-compiles
  # (aarch64- + x86_64-apple-darwin) wired into the build, tracked as a follow-up.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # Keep the bundle metadata aligned with the documented v1 support floor.
  minimumSystemVersion: "13.0"
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  # The Speech helper reads audio supplied by the Rust process; it does not own
  # microphone capture, Apple Events, or a JIT. Give that binary only its Speech
  # entitlement instead of the broad Electron child-process entitlement set.
  sign: scripts/sign-macos.mjs
  binaries:
    - Contents/Resources/sidecar/nautilus-macos-speech-helper-aarch64-apple-darwin
    - Contents/Resources/shortcut-helper/plainsong-native-shortcut-helper
  icon: build-resources/icon.icns
  # Required TCC usage strings — without these macOS terminates the app the
  # moment it accesses the microphone / speech recognition.
  extendInfo:
    NSMicrophoneUsageDescription: "Plainsong transcribes your speech on your Mac for dictation and meeting capture. Audio stays on your device."
    NSAudioCaptureUsageDescription: "Plainsong captures audio playing on your Mac to record and transcribe meetings. Depending on your transcription settings, meeting audio may be processed on this Mac or sent to the cloud provider you choose."
    NSSpeechRecognitionUsageDescription: "Plainsong can use Apple's on-device speech recognition to transcribe your dictation."
  # macOS-only native helper (built by `shortcut-helper:build`) that observes
  # the dictation hotkey via a listen-only CGEventTap so press-and-hold works.
  # Packaged the same way as the Rust sidecar: it must be signed with the same
  # identity/entitlements as the main app — see docs/CODE_SIGNING.md.
  extraResources:
    - from: dist-native/
      to: shortcut-helper
      filter:
        - plainsong-native-shortcut-helper
    - from: rust-sidecar/binaries/
      to: sidecar
      filter:
        - nautilus-macos-speech-helper-aarch64-apple-darwin

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Avoid a space-containing default artifact name ("Plainsong Setup 1.0.0.exe")
  # for cleaner download URLs.
  artifactName: ${productName}-Setup-${version}.${ext}

dmg:
  # The DMG is the primary download. electron-builder notarizes the .app before
  # creating this artifact, so sign the disk image here; the release workflow
  # then submits the signed DMG separately and staples its own notary ticket.
  sign: true
  # Stapling changes the DMG bytes after electron-builder has finished. Do not
  # emit a pre-staple DMG blockmap/hash into latest-mac.yml; macOS updates use
  # the ZIP and its blockmap, while the final DMG is covered by SHA256SUMS.txt.
  writeUpdateInfo: false

publish:
  provider: github
  owner: JonathanRReed
  repo: Plainsong
