appId: com.plainsong.app
productName: Plainsong
copyright: Copyright © 2026 Jonathan Reed

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/preload.js.map"
  - node_modules/**

extraResources:
  - from: rust-sidecar/target/release/
    to: sidecar
    filter:
      - plainsong-sidecar
      - plainsong-sidecar.exe
  - from: rust-sidecar/python/
    to: python
    filter:
      - asr/runner.py

mac:
  # arm64 only for v1: the Rust sidecar is compiled for the host arch by
  # `sidecar:build:release`, so an x64 artifact would bundle an arm64 binary and
  # be broken on Intel Macs. Intel support needs per-arch sidecar cross-compiles
  # (aarch64- + x86_64-apple-darwin) wired into the build — tracked as a follow-up.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  icon: build-resources/icon.icns
  # Required TCC usage strings — without these macOS terminates the app the
  # moment it accesses the microphone / speech recognition.
  extendInfo:
    NSMicrophoneUsageDescription: "Plainsong transcribes your speech on your Mac for dictation and meeting capture. Audio stays on your device."
    NSSpeechRecognitionUsageDescription: "Plainsong can use Apple's on-device speech recognition to transcribe your dictation."
  # macOS-only native helper (built by `shortcut-helper:build`) that observes
  # the dictation hotkey via a listen-only CGEventTap so press-and-hold works.
  # Packaged the same way as the Rust sidecar: it must be signed with the same
  # identity/entitlements as the main app — see docs/CODE_SIGNING.md.
  extraResources:
    - from: dist-native/
      to: shortcut-helper
      filter:
        - plainsong-native-shortcut-helper

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Avoid a space-containing default artifact name ("Plainsong Setup 1.0.0.exe")
  # for cleaner download URLs.
  artifactName: ${productName}-Setup-${version}.${ext}

dmg:
  sign: false

publish:
  provider: github
  owner: JonathanRReed
  repo: Plainsong
