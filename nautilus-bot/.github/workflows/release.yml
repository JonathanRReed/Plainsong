name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ── Extract version / channel ────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      is_beta: ${{ steps.version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            CHANNEL="stable"
          fi

          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]] || [ "$CHANNEL" = "beta" ]; then
            IS_BETA="true"
            CHANNEL="beta"
          else
            IS_BETA="false"
          fi

          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL"   >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA"   >> $GITHUB_OUTPUT
          echo "Version: $VERSION | Channel: $CHANNEL | Beta: $IS_BETA"

      - name: Validate live ASR secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          missing=()
          [ -n "$OPENAI_API_KEY" ] || missing+=("OPENAI_API_KEY")
          [ -n "$ELEVENLABS_API_KEY" ] || missing+=("ELEVENLABS_API_KEY")
          [ -n "$MISTRAL_API_KEY" ] || missing+=("MISTRAL_API_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required live cloud ASR secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run live cloud ASR smoke tests
        working-directory: nautilus-bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/live-cloud-asr-smoke.mjs --out ../artifacts/cloud-asr-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-asr-smoke
          path: artifacts/cloud-asr-smoke.json

  # ── macOS (Universal: x86_64 + aarch64) ─────────────────────────────────────
  build-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nautilus-bot/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        working-directory: nautilus-bot
        run: npm ci

      - name: Inject updater public key
        working-directory: nautilus-bot
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Live cloud ASR integration tests (Rust)
        working-directory: nautilus-bot/src-tauri
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: cargo test --test asr_live_cloud_integration --no-default-features --features asr-all,sqlcipher -- --nocapture

      - name: Local ASR performance gate (RTF <= 1.2)
        working-directory: nautilus-bot/src-tauri
        run: cargo test --test asr_local_performance_gate --no-default-features --features asr-all,sqlcipher -- --nocapture

      - name: Install Apple certificate into temp keychain
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build & sign (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Nautilus_${{ needs.prepare.outputs.version }}_aarch64.dmg` |
            | macOS (Intel)         | `Nautilus_${{ needs.prepare.outputs.version }}_x64.dmg` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/dmg/*.dmg
            nautilus-bot/src-tauri/target/release/bundle/macos/*.app.tar.gz
            nautilus-bot/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # ── Windows (x86_64) ─────────────────────────────────────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nautilus-bot/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: nautilus-bot
        run: npm ci

      - name: Inject updater public key
        working-directory: nautilus-bot
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Build & sign (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | Windows (64-bit) | `Nautilus_${{ needs.prepare.outputs.version }}_x64-setup.exe` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/msi/*.msi
            nautilus-bot/src-tauri/target/release/bundle/msi/*.msi.sig
            nautilus-bot/src-tauri/target/release/bundle/nsis/*.exe
            nautilus-bot/src-tauri/target/release/bundle/nsis/*.exe.sig

  # ── Linux (x86_64 — .deb + .AppImage) ───────────────────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nautilus-bot/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install dependencies
        working-directory: nautilus-bot
        run: npm ci

      - name: Inject updater public key
        working-directory: nautilus-bot
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | Linux .deb (Debian/Ubuntu) | `nautilus_${{ needs.prepare.outputs.version }}_amd64.deb` |
            | Linux AppImage             | `Nautilus_${{ needs.prepare.outputs.version }}_amd64.AppImage` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - name: GPG-sign Linux artifacts
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          for f in \
            nautilus-bot/src-tauri/target/release/bundle/deb/*.deb \
            nautilus-bot/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 \
              --pinentry-mode loopback --detach-sign --armor "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/deb/*.deb
            nautilus-bot/src-tauri/target/release/bundle/deb/*.deb.sig
            nautilus-bot/src-tauri/target/release/bundle/appimage/*.AppImage
            nautilus-bot/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # ── Generate update manifests + deploy to Cloudflare R2 ─────────────────────
  generate-manifests:
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Generate update manifests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          GH_BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          for PLATFORM in "darwin:aarch64:macos:Nautilus_${VERSION}_aarch64.dmg" \
                          "darwin:x86_64:macos:Nautilus_${VERSION}_x64.dmg" \
                          "windows:x86_64:windows:Nautilus_${VERSION}_x64-setup.exe" \
                          "linux:x86_64:linux:Nautilus_${VERSION}_amd64.AppImage"; do
            IFS=":" read -r OS ARCH DIR FILE <<< "$PLATFORM"
            [ -f "artifacts/$DIR/$FILE" ] || continue
            node scripts/generate-update-manifest.js \
              --version "$VERSION" \
              --platform "$OS" \
              --arch "$ARCH" \
              --channel "$CHANNEL" \
              --artifacts "artifacts/$DIR" \
              --output manifests \
              --github-url "$GH_BASE"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: manifests/

      # ── Deploy to Cloudflare R2 (S3-compatible API) ─────────────────────────
      - name: Deploy manifests to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Skip if R2 secrets are not configured
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "⚠️  Cloudflare R2 secrets not set — skipping CDN deploy."
            exit 0
          fi
          pip install --quiet awscli
          aws s3 sync manifests/ "s3://${R2_BUCKET}/updates/${{ needs.prepare.outputs.channel }}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --delete \
            --cache-control "max-age=60, must-revalidate"
          echo "✅ Manifests deployed to R2 bucket: ${R2_BUCKET}"


  # ── Summary ──────────────────────────────────────────────────────────────────
  notify:
    needs: [prepare, build-macos, build-windows, build-linux, generate-manifests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Release summary
        run: |
          MAC="${{ needs.build-macos.result }}"
          WIN="${{ needs.build-windows.result }}"
          LIN="${{ needs.build-linux.result }}"
          MAN="${{ needs.generate-manifests.result }}"
          echo "macOS:   $MAC"
          echo "Windows: $WIN"
          echo "Linux:   $LIN"
          echo "CDN:     $MAN"
          if [ "$MAC" = "success" ] && [ "$WIN" = "success" ] && \
             [ "$LIN" = "success" ] && [ "$MAN" = "success" ]; then
            echo "🚀 Release v${{ needs.prepare.outputs.version }} shipped on all platforms!"
          else
            echo "❌ At least one job failed — review logs above."
            exit 1
          fi
