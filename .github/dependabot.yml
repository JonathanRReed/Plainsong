version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/nautilus-bot"
    schedule:
      interval: "weekly"
    groups:
      app-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/nautilus-bot/rust-sidecar"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
