name: Release

# Cut a release by pushing a tag like v1.2.3, or trigger manually.
# Builds the Rust sidecar + Electron app per platform and publishes the
# artifacts to a GitHub Release. macOS builds are signed + notarized only when
# the signing secrets are present; otherwise an unsigned build is published
# (users run `xattr -dr com.apple.quarantine /Applications/Nautilus.app` once).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.2.3)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: release:mac
          - os: windows-latest
            build: release:win
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nautilus-bot/rust-sidecar

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sign + notarize on macOS only when the Developer ID secrets exist.
      # Forks and unsigned builds skip this and publish an unsigned app.
      - name: Configure macOS signing
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: echo "Code signing enabled for this build."
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Build and publish
        run: bun run ${{ matrix.build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (optional).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
