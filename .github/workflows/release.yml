name: Release

# Cut a release by pushing a tag like v1.2.3, or trigger manually.
# Builds the Rust sidecar + Electron app and publishes the artifacts to a
# GitHub Release.
#
# v1 ships macOS arm64 only. The Windows leg was removed: the sidecar's
# default cargo features (whisper-gpu = Metal/CoreML) do not compile on
# Windows, and Windows support is tracked as future platform work in
# LAUNCH.md ("Windows/Linux support").
#
# macOS builds are signed + notarized only when the signing secrets are
# present; otherwise an unsigned build is published (users run
# `xattr -dr com.apple.quarantine /Applications/Plainsong.app` once).
# Note: the in-app updater cannot install updates into an unsigned build —
# unsigned users re-download from GitHub Releases (the app tells them so).
#
# electron-builder publishes the release as a DRAFT (no releaseType is set in
# electron-builder.yml). After the workflow succeeds, review the draft on
# GitHub and click "Publish release" — electron-updater users see nothing
# until the draft is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.2.3)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # electron-builder derives the GitHub release tag from package.json, not
      # from the pushed tag — a mismatch would silently publish assets under
      # the wrong release tag with a disagreeing latest-mac.yml version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nautilus-bot/rust-sidecar

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sign + notarize only when the Developer ID secrets exist.
      # Forks and unsigned builds skip this and publish an unsigned app.
      - name: Configure macOS signing
        if: env.CSC_LINK != ''
        run: echo "Code signing enabled for this build."
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Build and publish
        run: bun run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (optional).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
