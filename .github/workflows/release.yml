name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  RUST_VERSION: "stable"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      is_beta: ${{ steps.version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            CHANNEL="stable"
          fi

          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]] || [ "$CHANNEL" = "beta" ]; then
            IS_BETA="true"
            CHANNEL="beta"
          else
            IS_BETA="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION | Channel: $CHANNEL | Beta: $IS_BETA"

      - name: Validate live cloud ASR secrets
        id: cloud_secret_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          missing=()
          [ -n "$OPENAI_API_KEY" ] || missing+=("OPENAI_API_KEY")
          [ -n "$ELEVENLABS_API_KEY" ] || missing+=("ELEVENLABS_API_KEY")
          [ -n "$MISTRAL_API_KEY" ] || missing+=("MISTRAL_API_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required live cloud ASR secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: Run live cloud ASR smoke gate
        id: cloud_smoke
        working-directory: nautilus-bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p ../artifacts
          node scripts/live-cloud-asr-smoke.mjs --out ../artifacts/cloud-asr-smoke.json

      - name: Validate cloud smoke artifact schema
        working-directory: nautilus-bot
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/cloud-asr-smoke.schema.json \
            --file ../artifacts/cloud-asr-smoke.json

      - name: Upload cloud smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-asr-smoke
          path: artifacts/cloud-asr-smoke.json

  preflight-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: ASR asset + runtime preflight
        id: asr_preflight
        working-directory: nautilus-bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NAUTILUS_ASR_ASSET_BUNDLE_URL: ${{ secrets.NAUTILUS_ASR_ASSET_BUNDLE_URL }}
        run: |
          mkdir -p ../artifacts
          node scripts/provision-asr-assets.mjs --provision --out ../artifacts/asr-preflight-macos.json

      - name: Validate macOS ASR preflight artifact schema
        working-directory: nautilus-bot
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/asr-preflight.schema.json \
            --file ../artifacts/asr-preflight-macos.json

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-preflight-macos
          path: artifacts/asr-preflight-macos.json

  preflight-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: ASR asset + runtime preflight
        id: asr_preflight
        working-directory: nautilus-bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NAUTILUS_ASR_ASSET_BUNDLE_URL: ${{ secrets.NAUTILUS_ASR_ASSET_BUNDLE_URL }}
        shell: bash
        run: |
          mkdir -p ../artifacts
          node scripts/provision-asr-assets.mjs --provision --out ../artifacts/asr-preflight-windows.json

      - name: Validate Windows ASR preflight artifact schema
        working-directory: nautilus-bot
        shell: bash
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/asr-preflight.schema.json \
            --file ../artifacts/asr-preflight-windows.json

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-preflight-windows
          path: artifacts/asr-preflight-windows.json

  build-macos:
    needs: [prepare, preflight-macos]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: Inject updater public key
        working-directory: nautilus-bot
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Live cloud ASR integration gate
        id: live_cloud_gate
        working-directory: nautilus-bot/src-tauri
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_live_cloud_integration --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-live-cloud-gate.log

      - name: Local ASR smoke gate
        id: local_smoke_gate
        working-directory: nautilus-bot/src-tauri
        shell: bash
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_local_provider_smoke --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-local-smoke-gate.log

      - name: Local ASR performance gate (RTF <= 1.2)
        id: local_perf_gate
        working-directory: nautilus-bot/src-tauri
        shell: bash
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_local_performance_gate --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-local-perf-gate.log

      - name: Install Apple certificate into temp keychain
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build & sign (Tauri)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Nautilus_${{ needs.prepare.outputs.version }}_aarch64.dmg` |
            | macOS (Intel)         | `Nautilus_${{ needs.prepare.outputs.version }}_x64.dmg` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - name: Cold-start gate (M1 baseline)
        id: cold_start_gate
        working-directory: nautilus-bot
        shell: bash
        run: |
          mkdir -p ../artifacts
          set -o pipefail
          pkill -f '/Nautilus.app/Contents/MacOS/nautilus-bot' || true
          node scripts/cold-start-gate.mjs --threshold-ms 2500 --ready-command "pgrep -f '/Nautilus.app/Contents/MacOS/nautilus-bot'" -- bash -lc "open \"src-tauri/target/release/bundle/macos/Nautilus.app\"" | tee ../artifacts/cold-start-macos.json
          pkill -f '/Nautilus.app/Contents/MacOS/nautilus-bot' || true

      - name: Validate cold-start artifact schema
        id: cold_start_artifact
        working-directory: nautilus-bot
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/cold-start-gate.schema.json \
            --file ../artifacts/cold-start-macos.json

      - name: Verify packaged QA matrix
        id: qa_matrix_gate
        working-directory: nautilus-bot
        run: node scripts/verify-qa-matrix.mjs --file docs/packaged-app-qa-matrix.md

      - name: Verify benchmark launch gates (CP-13/CP-14/CP-15)
        id: benchmark_gate
        working-directory: nautilus-bot
        run: |
          mkdir -p ../artifacts
          node scripts/verify-benchmark-gates.mjs \
            --schema docs/evals/benchmark-run.schema.json \
            --baseline docs/evals/benchmark-run-baseline.json \
            --candidate docs/evals/benchmark-run-latest-macos.json \
            --out ../artifacts/benchmark-gates-macos.json

      - name: Validate benchmark gate artifact schema
        id: benchmark_gate_schema
        working-directory: nautilus-bot
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/benchmark-gate-result.schema.json \
            --file ../artifacts/benchmark-gates-macos.json

      - name: Export packaged QA evidence bundle
        id: qa_evidence_bundle
        working-directory: nautilus-bot
        run: |
          node scripts/export-qa-evidence-bundle.mjs \
            --matrix docs/packaged-app-qa-matrix.md \
            --out ../artifacts/packaged-qa-evidence-bundle-macos.json

      - name: Validate packaged QA evidence bundle schema
        id: qa_evidence_bundle_schema
        working-directory: nautilus-bot
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/packaged-qa-evidence-bundle.schema.json \
            --file ../artifacts/packaged-qa-evidence-bundle-macos.json

      - name: Create macOS gate summary
        if: always()
        working-directory: nautilus-bot
        run: |
          mkdir -p ../artifacts
          report="../artifacts/release-gates-macos.md"
          {
            echo "# Release Gate Report (macOS)"
            echo
            echo "Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| ASR preflight | ${{ needs.preflight-macos.result }} |"
            echo "| Cloud integration gate | ${{ steps.live_cloud_gate.outcome }} |"
            echo "| Local smoke gate | ${{ steps.local_smoke_gate.outcome }} |"
            echo "| Local performance gate | ${{ steps.local_perf_gate.outcome }} |"
            echo "| Build & sign | ${{ steps.tauri_build.outcome }} |"
            echo "| Cold-start gate | ${{ steps.cold_start_gate.outcome }} |"
            echo "| Cold-start artifact schema | ${{ steps.cold_start_artifact.outcome }} |"
            echo "| Packaged QA matrix check | ${{ steps.qa_matrix_gate.outcome }} |"
            echo "| Benchmark launch gates | ${{ steps.benchmark_gate.outcome }} |"
            echo "| Benchmark gate artifact schema | ${{ steps.benchmark_gate_schema.outcome }} |"
            echo "| Packaged QA evidence bundle | ${{ steps.qa_evidence_bundle.outcome }} |"
            echo "| Packaged QA evidence schema | ${{ steps.qa_evidence_bundle_schema.outcome }} |"
          } > "$report"

      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/dmg/*.dmg
            nautilus-bot/src-tauri/target/release/bundle/macos/*.app.tar.gz
            nautilus-bot/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            artifacts/asr-live-cloud-gate.log
            artifacts/asr-local-smoke-gate.log
            artifacts/asr-local-perf-gate.log
            artifacts/cold-start-macos.json
            artifacts/release-gates-macos.md
            artifacts/benchmark-gates-macos.json
            artifacts/packaged-qa-evidence-bundle-macos.json
            nautilus-bot/docs/packaged-app-qa-matrix.md

  build-windows:
    needs: [prepare, preflight-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: Inject updater public key
        working-directory: nautilus-bot
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Live cloud ASR integration gate
        id: live_cloud_gate
        working-directory: nautilus-bot/src-tauri
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_live_cloud_integration --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-live-cloud-gate-windows.log

      - name: Local ASR smoke gate
        id: local_smoke_gate
        working-directory: nautilus-bot/src-tauri
        shell: bash
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_local_provider_smoke --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-local-smoke-gate-windows.log

      - name: Local ASR performance gate (RTF <= 1.2)
        id: local_perf_gate
        working-directory: nautilus-bot/src-tauri
        shell: bash
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          cargo test --test asr_local_performance_gate --no-default-features --features asr-all,sqlcipher -- --nocapture | tee ../../artifacts/asr-local-perf-gate-windows.log

      - name: Build & sign (Tauri)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | Windows (64-bit) | `Nautilus_${{ needs.prepare.outputs.version }}_x64-setup.exe` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - name: Verify packaged QA matrix
        id: qa_matrix_gate
        working-directory: nautilus-bot
        run: node scripts/verify-qa-matrix.mjs --file docs/packaged-app-qa-matrix.md

      - name: Verify benchmark launch gates (CP-13/CP-14/CP-15)
        id: benchmark_gate
        working-directory: nautilus-bot
        shell: bash
        run: |
          mkdir -p ../artifacts
          node scripts/verify-benchmark-gates.mjs \
            --schema docs/evals/benchmark-run.schema.json \
            --baseline docs/evals/benchmark-run-baseline.json \
            --candidate docs/evals/benchmark-run-latest-windows.json \
            --out ../artifacts/benchmark-gates-windows.json

      - name: Validate benchmark gate artifact schema
        id: benchmark_gate_schema
        working-directory: nautilus-bot
        shell: bash
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/benchmark-gate-result.schema.json \
            --file ../artifacts/benchmark-gates-windows.json

      - name: Export packaged QA evidence bundle
        id: qa_evidence_bundle
        working-directory: nautilus-bot
        shell: bash
        run: |
          node scripts/export-qa-evidence-bundle.mjs \
            --matrix docs/packaged-app-qa-matrix.md \
            --out ../artifacts/packaged-qa-evidence-bundle-windows.json

      - name: Validate packaged QA evidence bundle schema
        id: qa_evidence_bundle_schema
        working-directory: nautilus-bot
        shell: bash
        run: |
          node scripts/validate-gate-artifact.mjs \
            --schema docs/ci/schemas/packaged-qa-evidence-bundle.schema.json \
            --file ../artifacts/packaged-qa-evidence-bundle-windows.json

      - name: Create Windows gate summary
        if: always()
        working-directory: nautilus-bot
        shell: bash
        run: |
          mkdir -p ../artifacts
          report="../artifacts/release-gates-windows.md"
          {
            echo "# Release Gate Report (Windows)"
            echo
            echo "Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| ASR preflight | ${{ needs.preflight-windows.result }} |"
            echo "| Cloud integration gate | ${{ steps.live_cloud_gate.outcome }} |"
            echo "| Local smoke gate | ${{ steps.local_smoke_gate.outcome }} |"
            echo "| Local performance gate | ${{ steps.local_perf_gate.outcome }} |"
            echo "| Build & sign | ${{ steps.tauri_build.outcome }} |"
            echo "| Packaged QA matrix check | ${{ steps.qa_matrix_gate.outcome }} |"
            echo "| Benchmark launch gates | ${{ steps.benchmark_gate.outcome }} |"
            echo "| Benchmark gate artifact schema | ${{ steps.benchmark_gate_schema.outcome }} |"
            echo "| Packaged QA evidence bundle | ${{ steps.qa_evidence_bundle.outcome }} |"
            echo "| Packaged QA evidence schema | ${{ steps.qa_evidence_bundle_schema.outcome }} |"
          } > "$report"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/msi/*.msi
            nautilus-bot/src-tauri/target/release/bundle/msi/*.msi.sig
            nautilus-bot/src-tauri/target/release/bundle/nsis/*.exe
            nautilus-bot/src-tauri/target/release/bundle/nsis/*.exe.sig
            artifacts/asr-live-cloud-gate-windows.log
            artifacts/asr-local-smoke-gate-windows.log
            artifacts/asr-local-perf-gate-windows.log
            artifacts/release-gates-windows.md
            artifacts/benchmark-gates-windows.json
            artifacts/packaged-qa-evidence-bundle-windows.json
            nautilus-bot/docs/packaged-app-qa-matrix.md

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install dependencies
        working-directory: nautilus-bot
        run: bun install --frozen-lockfile

      - name: Inject updater public key
        working-directory: nautilus-bot
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/inject-updater-pubkey.js

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: nautilus-bot
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: >-
            Nautilus ${{ needs.prepare.outputs.channel == 'beta' && 'Beta ' || '' }}v${{ needs.prepare.outputs.version }}
          releaseBody: |
            ${{ needs.prepare.outputs.channel == 'beta' && '> ⚠️ Beta release — may be less stable.' || '' }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download
            | Platform | File |
            |---|---|
            | Linux .deb (Debian/Ubuntu) | `nautilus_${{ needs.prepare.outputs.version }}_amd64.deb` |
            | Linux AppImage             | `Nautilus_${{ needs.prepare.outputs.version }}_amd64.AppImage` |
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_beta == 'true' }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            nautilus-bot/src-tauri/target/release/bundle/deb/*.deb
            nautilus-bot/src-tauri/target/release/bundle/appimage/*.AppImage

  generate-manifests:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Generate update manifests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          GH_BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          for PLATFORM in "darwin:aarch64:macos:Nautilus_${VERSION}_aarch64.dmg" \
                          "darwin:x86_64:macos:Nautilus_${VERSION}_x64.dmg" \
                          "windows:x86_64:windows:Nautilus_${VERSION}_x64-setup.exe" \
                          "linux:x86_64:linux:Nautilus_${VERSION}_amd64.AppImage"; do
            IFS=":" read -r OS ARCH DIR FILE <<< "$PLATFORM"
            [ -f "artifacts/$DIR/$FILE" ] || continue
            node nautilus-bot/scripts/generate-update-manifest.js \
              --version "$VERSION" \
              --platform "$OS" \
              --arch "$ARCH" \
              --channel "$CHANNEL" \
              --artifacts "artifacts/$DIR" \
              --output manifests \
              --github-url "$GH_BASE"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: manifests/

      - name: Deploy manifests to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "Cloudflare R2 secrets not set, skipping deploy."
            exit 0
          fi
          pip install --quiet awscli
          aws s3 sync manifests/ "s3://${R2_BUCKET}/updates/${{ needs.prepare.outputs.channel }}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --delete \
            --cache-control "max-age=60, must-revalidate"

  notify:
    needs: [prepare, preflight-macos, preflight-windows, build-macos, build-windows, build-linux, generate-manifests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Release summary
        run: |
          PRE_MAC="${{ needs.preflight-macos.result }}"
          PRE_WIN="${{ needs.preflight-windows.result }}"
          MAC="${{ needs.build-macos.result }}"
          WIN="${{ needs.build-windows.result }}"
          LIN="${{ needs.build-linux.result }}"
          MAN="${{ needs.generate-manifests.result }}"
          echo "preflight-macos:   $PRE_MAC"
          echo "preflight-windows: $PRE_WIN"
          echo "macOS:             $MAC"
          echo "Windows:           $WIN"
          echo "Linux (non-blocking): $LIN"
          echo "manifests/CDN:     $MAN"

          if [ "$PRE_MAC" = "success" ] && [ "$PRE_WIN" = "success" ] && \
             [ "$MAC" = "success" ] && [ "$WIN" = "success" ] && \
             [ "$MAN" = "success" ]; then
            echo "Release gates passed for macOS + Windows."
          else
            echo "At least one launch-blocking gate failed."
            exit 1
          fi
