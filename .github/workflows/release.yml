name: Beta release candidate

# Cut the first beta candidate with tag v0.9.0-beta.2, or trigger manually for
# that existing tag. The package-version check below remains authoritative.
# Builds the Rust sidecar + Electron app, requires Developer ID signing and
# Apple notarization, verifies the stapled app with Gatekeeper, then stages the
# artifact-verified assets in a draft GitHub Release. This workflow does not
# run the real-hardware Dictation, Meetings, clean-install, updater-journey, or
# three-hour soak gates, so its draft is not by itself a beta-ready verdict.
#
# The limited beta ships macOS arm64 only. The Windows leg was removed: the sidecar's
# default cargo features (whisper-gpu = Metal) do not compile on
# Windows, and Windows support is tracked as future platform work in
# LAUNCH.md ("Windows/Linux support").
#
# Official releases fail closed if signing or notarization credentials are
# missing. electron-builder never publishes directly. After every source,
# package, updater-metadata, signing, stapling, and Gatekeeper check succeeds,
# the final step creates or refreshes an artifact-only draft for human review.
# Publishing still requires the current aggregate release audit and manual
# product gates. Updater users see nothing until the draft is deliberately
# published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing beta tag to build (first: v0.9.0-beta.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, verify, and stage artifact draft (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - name: Validate and resolve release tag
        id: release-ref
        working-directory: ${{ github.workspace }}
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$DISPATCH_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $TAG_PATTERN ]]; then
            echo "Release tag must be a valid v-prefixed semantic version" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_REF="refs/tags/$RELEASE_TAG"
          else
            RELEASE_REF="$GITHUB_REF"
          fi
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Release ref must be the exact tag ref refs/tags/$RELEASE_TAG" >&2
            exit 1
          fi
          if ! git check-ref-format "$RELEASE_REF"; then
            echo "Invalid release tag ref: $RELEASE_REF" >&2
            exit 1
          fi

          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'RELEASE_REF=%s\n' "$RELEASE_REF" >> "$GITHUB_ENV"
          printf 'ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release-ref.outputs.ref }}
          fetch-tags: true

      - name: Verify checkout matches release tag
        run: |
          if ! git show-ref --verify --quiet "$RELEASE_REF"; then
            echo "Checked-out tag ref is missing: $RELEASE_REF" >&2
            exit 1
          fi
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          TAG_COMMIT="$(git rev-parse --verify "${RELEASE_REF}^{commit}")"
          if [ "$HEAD_COMMIT" != "$TAG_COMMIT" ]; then
            echo "HEAD $HEAD_COMMIT does not match $RELEASE_REF at $TAG_COMMIT" >&2
            exit 1
          fi

      # The release tag, package version, and updater manifest must describe
      # one exact build. The tag must already exist on GitHub.
      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$PKG"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66 # 1.93.0

      - name: Rust cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # post-v2.9.2 cleanup fix (#377)
        with:
          workspaces: nautilus-bot/rust-sidecar

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate third-party notices
        run: bun run licenses:generate

      - name: Verify source
        run: |
          bun run gate:ipc-contract
          bun run gate:dead-code
          bun run typecheck
          bun run test
          bun run lint:rust
          bun run test:rust

      - name: Require signing and notarization credentials
        run: bun run gate:release-credentials:preflight
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build signed and notarized release
        run: bun run release:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify release dependency boundary
        run: bun run gate:release:dependencies

      - name: Verify TCC usage strings
        run: |
          PLIST="release/mac-arm64/Plainsong.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$PLIST"

      - name: Verify packaged native executables
        run: bun run gate:packaged:macos:native

      - name: Verify packaged updater metadata
        run: bun run qa:packaged:macos:update-metadata

      - name: Verify package size
        run: bun run gate:size

      - name: Verify packaged licenses
        run: bun run gate:release:licenses

      - name: Verify packaged cold start
        run: bun run gate:cold-start

      # electron-builder notarizes and staples the app before it creates the DMG.
      # The disk image is a separate signed artifact and needs its own notary
      # submission and ticket before the release trust gate can accept it.
      - name: Notarize and staple signed DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          DMGS=(release/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed DMG, found ${#DMGS[@]}" >&2
            exit 1
          fi
          xcrun notarytool submit "${DMGS[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${DMGS[0]}"

      - name: Verify signed, stapled, Gatekeeper-approved app
        run: bun run gate:release:macos:trust
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify release assets and write checksums
        run: |
          shopt -s nullglob
          DMGS=(release/*.dmg)
          ZIPS=(release/*-mac.zip)
          BLOCKMAPS=(release/*.blockmap)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#DMGS[@]}" >&2
            exit 1
          fi
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS ZIP, found ${#ZIPS[@]}" >&2
            exit 1
          fi
          if [ "${#BLOCKMAPS[@]}" -lt 1 ]; then
            echo "Expected at least one updater blockmap" >&2
            exit 1
          fi
          test -s release/beta-mac.yml
          shasum -a 256 "${DMGS[@]}" "${ZIPS[@]}" "${BLOCKMAPS[@]}" release/beta-mac.yml \
            | sed 's#  release/#  #' > release/SHA256SUMS.txt
          test -s release/SHA256SUMS.txt

      # Only artifact-verified files reach GitHub. This step does not assert
      # beta readiness. Existing public releases are never modified; a rerun
      # may refresh assets on an existing draft.
      - name: Stage artifact-only draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ASSETS=(
            release/*.dmg
            release/*-mac.zip
            release/*.blockmap
            release/beta-mac.yml
            release/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq '.isDraft'
            )"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Refusing to modify published release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Plainsong $RELEASE_TAG"
          fi
