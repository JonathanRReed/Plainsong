name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: nautilus-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nautilus-bot/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Rust format check
        run: cargo fmt --check
        working-directory: nautilus-bot/src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: nautilus-bot/src-tauri
        continue-on-error: true

      - name: Rust check
        run: cargo check --all-targets
        working-directory: nautilus-bot/src-tauri

      - name: Rust unit tests
        run: cargo test --lib
        working-directory: nautilus-bot/src-tauri
