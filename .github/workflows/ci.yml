name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "nautilus-bot/docs/**"
      - "nautilus-bot/artifacts/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "nautilus-bot/docs/**"
      - "nautilus-bot/artifacts/**"
  schedule:
    # Weekly packaging-drift check (runs the verify-package job).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-web:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify IPC contract
        run: bun run gate:ipc-contract

      - name: Verify dead-code hygiene
        run: bun run gate:dead-code

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  verify-build:
    name: Production build
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer
        run: bun run build:renderer

      - name: Compile Electron main
        run: bun run electron:compile

  verify-rust:
    name: Rust format, clippy, and tests
    needs: verify-web
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nautilus-bot/rust-sidecar

      - name: Rust format
        run: cargo fmt --manifest-path rust-sidecar/Cargo.toml --check

      # Build/lint/test the default feature set (asr-all + whisper-gpu + sqlcipher),
      # i.e. the configuration shipped to users. macOS runners provide Metal/CoreML.
      - name: Rust clippy
        run: cargo clippy --locked --manifest-path rust-sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path rust-sidecar/Cargo.toml --lib

  verify-package:
    name: Package and verify (macOS)
    needs: [verify-build, verify-rust]
    # Build the ZIP target so electron-builder emits the same app-update.yml,
    # latest-mac.yml, ZIP, and blockmap used by the updater. Runs on main
    # pushes and a weekly cron (not on PRs) to keep macOS runner cost in check.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nautilus-bot/rust-sidecar

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS ZIP without publishing
        run: bun run electron:build:mac

      # Without these TCC usage strings macOS terminates the app the moment it
      # touches the microphone / speech recognition.
      - name: Verify TCC usage strings
        run: |
          PLIST="release/mac-arm64/Plainsong.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$PLIST"

      # Reuse the package hook's verifier so CI checks the app and every bundled
      # native executable against the same arm64-only contract.
      - name: Verify packaged native executables
        run: bun run gate:packaged:macos:native

      - name: Verify update metadata
        run: bun run qa:packaged:macos:update-metadata
