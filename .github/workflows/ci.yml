name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "nautilus-bot/docs/**"
      - "nautilus-bot/artifacts/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "nautilus-bot/docs/**"
      - "nautilus-bot/artifacts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-web:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  verify-rust:
    name: Rust format and clippy
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: nautilus-bot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path rust-sidecar/Cargo.toml --check

      - name: Rust clippy
        env:
          WHISPER_NATIVE: "OFF"
        run: cargo clippy --locked --manifest-path rust-sidecar/Cargo.toml --all-targets --no-default-features --features asr-whisper,ndarray,rustfft,sqlcipher
